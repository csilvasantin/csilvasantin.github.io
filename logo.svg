<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="fluxCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#7df9ff"/>
      <stop offset="70%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </radialGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#c0c0c0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="198" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="196" fill="none" stroke="#7c5cfc" stroke-width="3" opacity="0.5"/>

  <!-- Outer ring - clock style -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#4a90d9" stroke-width="1.5" opacity="0.3"/>

  <!-- Clock tick marks -->
  <g opacity="0.4" stroke="#7df9ff" stroke-width="2">
    <line x1="200" y1="25" x2="200" y2="45"/>
    <line x1="200" y1="355" x2="200" y2="375"/>
    <line x1="25" y1="200" x2="45" y2="200"/>
    <line x1="355" y1="200" x2="375" y2="200"/>
    <line x1="76" y1="76" x2="90" y2="90"/>
    <line x1="310" y1="310" x2="324" y2="324"/>
    <line x1="324" y1="76" x2="310" y2="90"/>
    <line x1="90" y1="310" x2="76" y2="324"/>
  </g>

  <!-- Flux Capacitor Y-shape with double stroke for glow effect -->
  <g>
    <!-- Glow layer -->
    <line x1="200" y1="200" x2="200" y2="80" stroke="#7df9ff" stroke-width="10" stroke-linecap="round" opacity="0.25"/>
    <line x1="200" y1="200" x2="96" y2="300" stroke="#7df9ff" stroke-width="10" stroke-linecap="round" opacity="0.25"/>
    <line x1="200" y1="200" x2="304" y2="300" stroke="#7df9ff" stroke-width="10" stroke-linecap="round" opacity="0.25"/>
    <!-- Main lines -->
    <line x1="200" y1="200" x2="200" y2="80" stroke="#7df9ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="200" x2="96" y2="300" stroke="#7df9ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="200" x2="304" y2="300" stroke="#7df9ff" stroke-width="4" stroke-linecap="round"/>

    <!-- Flux nodes - outer glow -->
    <circle cx="200" cy="80" r="16" fill="#7df9ff" opacity="0.2"/>
    <circle cx="96" cy="300" r="16" fill="#7df9ff" opacity="0.2"/>
    <circle cx="304" cy="300" r="16" fill="#7df9ff" opacity="0.2"/>
    <!-- Flux nodes -->
    <circle cx="200" cy="80" r="10" fill="#7df9ff" opacity="0.9"/>
    <circle cx="96" cy="300" r="10" fill="#7df9ff" opacity="0.9"/>
    <circle cx="304" cy="300" r="10" fill="#7df9ff" opacity="0.9"/>
    <!-- Node inner core -->
    <circle cx="200" cy="80" r="5" fill="#ffffff"/>
    <circle cx="96" cy="300" r="5" fill="#ffffff"/>
    <circle cx="304" cy="300" r="5" fill="#ffffff"/>
  </g>

  <!-- Center core -->
  <circle cx="200" cy="200" r="30" fill="#7df9ff" opacity="0.15"/>
  <circle cx="200" cy="200" r="22" fill="url(#fluxCore)"/>
  <circle cx="200" cy="200" r="12" fill="#ffffff" opacity="0.9"/>

  <!-- Energy dots along the Y lines -->
  <g opacity="0.7">
    <circle cx="200" cy="120" r="4" fill="#7df9ff"/>
    <circle cx="200" cy="150" r="3" fill="#7df9ff" opacity="0.5"/>
    <circle cx="135" cy="265" r="4" fill="#7df9ff"/>
    <circle cx="155" cy="240" r="3" fill="#7df9ff" opacity="0.5"/>
    <circle cx="265" cy="265" r="4" fill="#7df9ff"/>
    <circle cx="245" cy="240" r="3" fill="#7df9ff" opacity="0.5"/>
  </g>

  <!-- Speed fire trails (orange like the DeLorean trails) -->
  <g opacity="0.8">
    <line x1="30" y1="175" x2="100" y2="175" stroke="#ff6b00" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="190" x2="110" y2="190" stroke="#ff8c00" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="20" y1="205" x2="95" y2="205" stroke="#ff6b00" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="40" y1="220" x2="105" y2="220" stroke="#ff8c00" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- "CS" initials in chrome/metallic style -->
  <text x="200" y="215" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif"
        font-size="48" font-weight="900" fill="url(#chrome)"
        letter-spacing="6" opacity="0.85">CS</text>

  <!-- Small decorative text "1.21 GW" -->
  <text x="200" y="345" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="14" fill="#ff6b00" letter-spacing="3" opacity="0.7">1.21 GW</text>

  <!-- Outer neon ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#7df9ff" stroke-width="1" opacity="0.3"/>
</svg>
