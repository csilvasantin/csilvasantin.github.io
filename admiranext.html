<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdmiraNext — Council Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a14;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #e74c3c, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .subtitle .live { color: #44bb44; }

        /* Generation toggle */
        .gen-toggle {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 1.5rem;
        }
        .gen-btn {
            padding: 0.7rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            border: 2px solid #333;
            background: #1a1a2e;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }
        .gen-btn:first-child { border-radius: 10px 0 0 10px; }
        .gen-btn:last-child { border-radius: 0 10px 10px 0; }
        .gen-btn:hover { background: #222; color: #aaa; }
        .gen-btn.active-leyendas {
            background: linear-gradient(135deg, #b8860b, #daa520);
            color: #fff;
            border-color: #daa520;
            box-shadow: 0 0 15px rgba(218, 165, 32, 0.3);
        }
        .gen-btn.active-coetaneos {
            background: linear-gradient(135deg, #2980b9, #3498db);
            color: #fff;
            border-color: #3498db;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.3);
        }

        /* Summary bar */
        .summary {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 1rem 0 1.5rem;
            flex-wrap: wrap;
        }
        .summary-item {
            text-align: center;
            padding: 0.6rem 1.2rem;
            background: #1a1a2e;
            border-radius: 10px;
        }
        .summary-number { font-size: 1.8rem; font-weight: 800; }
        .summary-number.green { color: #44bb44; }
        .summary-number.red { color: #e74c3c; }
        .summary-number.blue { color: #3498db; }
        .summary-label { font-size: 0.7rem; color: #888; margin-top: 0.2rem; }

        /* Council image */
        .council-image {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 1.5rem;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .council-image img {
            width: 100%;
            display: block;
            image-rendering: pixelated;
            transition: opacity 0.3s ease;
        }

        /* Nameplate overlays */
        .nameplates {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
        }
        .np {
            position: absolute;
            padding: 2px 6px;
            font-size: 0.55rem;
            font-weight: 800;
            text-align: center;
            border-radius: 3px;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            transition: all 0.3s ease;
            border: 1px solid rgba(0,0,0,0.3);
            text-shadow: 0 1px 1px rgba(0,0,0,0.3);
        }
        .np.gold {
            background: linear-gradient(180deg, #daa520, #b8860b);
            color: #fff;
            box-shadow: 0 0 6px rgba(218,165,32,0.5);
        }
        .np.gray {
            background: linear-gradient(180deg, #555, #3a3a3a);
            color: #888;
            box-shadow: none;
        }
        .np .np-role {
            font-size: 0.45rem;
            opacity: 0.8;
            display: block;
        }

        /* Status grid */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .side-panel {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 1.2rem;
            border-top: 3px solid;
        }
        .side-panel.creativo { border-color: #e74c3c; }
        .side-panel.racional { border-color: #3498db; }

        .side-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .side-machines {
            font-size: 0.7rem;
            color: #666;
            margin-left: auto;
        }

        .member-row {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: all 0.3s;
        }
        .member-row:hover { background: rgba(255,255,255,0.05); }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot.online {
            background: #44bb44;
            box-shadow: 0 0 6px #44bb44;
            animation: pulse 2s infinite;
        }
        .status-dot.offline { background: #555; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .member-icon { font-size: 1.2rem; }
        .member-info { flex: 1; }
        .member-name { font-weight: 600; font-size: 0.95rem; }
        .member-role { font-size: 0.7rem; color: #888; }

        .machine-tag {
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            background: #16213e;
            color: #666;
            text-align: right;
            line-height: 1.3;
        }
        .machine-tag.online { background: rgba(68, 187, 68, 0.12); color: #44bb44; }

        /* Power toggle button */
        .power-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #333;
            background: #1a1a2e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.3s;
            flex-shrink: 0;
            position: relative;
        }
        .power-btn:hover { transform: scale(1.15); }
        .power-btn.on {
            border-color: #44bb44;
            background: rgba(68, 187, 68, 0.15);
            box-shadow: 0 0 10px rgba(68, 187, 68, 0.4);
        }
        .power-btn.off {
            border-color: #555;
            background: rgba(85, 85, 85, 0.15);
        }
        .power-btn.loading {
            pointer-events: none;
            opacity: 0.5;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .power-btn .power-icon {
            width: 14px; height: 14px;
        }
        .power-btn.on .power-icon { filter: drop-shadow(0 0 3px #44bb44); }

        /* Nameplate colors */
        .nameplate-gold .member-name { color: #DAA520; }
        .nameplate-gray .member-name { color: #555; }

        .footer {
            text-align: center;
            color: #333;
            font-size: 0.75rem;
            margin-top: 2rem;
            padding: 1rem;
        }
        #last-check { color: #555; }

        /* Screenshot thumbnails */
        .screen-wrap {
            position: relative;
            width: 56px;
            height: 36px;
            flex-shrink: 0;
        }
        .screen-thumb {
            width: 56px;
            height: 36px;
            border-radius: 4px;
            object-fit: cover;
            cursor: pointer;
            border: 1px solid #333;
            background: #111;
            transition: all 0.4s;
            image-rendering: auto;
            filter: grayscale(1) brightness(0.6);
        }
        .screen-thumb.live {
            filter: none;
            border-color: #44bb44;
            box-shadow: 0 0 6px rgba(68,187,68,0.3);
        }
        .screen-wrap:hover .screen-thumb {
            transform: scale(1.3);
            border-color: #666;
            box-shadow: 0 0 12px rgba(255,255,255,0.15);
            z-index: 10;
            position: relative;
        }
        .screen-wrap:hover .screen-thumb.live {
            border-color: #44bb44;
            box-shadow: 0 0 16px rgba(68,187,68,0.4);
        }
        .screen-time {
            position: absolute;
            bottom: 1px;
            right: 2px;
            font-size: 0.4rem;
            font-weight: 700;
            color: #fff;
            background: rgba(68,187,68,0.8);
            padding: 0 3px;
            border-radius: 2px;
            line-height: 1.4;
            pointer-events: none;
            display: none;
        }
        .screen-thumb.live + .screen-time { display: block; }
        .screen-placeholder {
            width: 56px;
            height: 36px;
            border-radius: 4px;
            border: 1px solid #222;
            background: #0a0a14;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #333;
        }

        /* Fullscreen overlay */
        .screen-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.92);
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            flex-direction: column;
            gap: 1rem;
        }
        .screen-overlay.visible { display: flex; }
        .screen-overlay img {
            max-width: 95vw;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        .screen-overlay-label {
            color: #aaa;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            line-height: 1.6;
        }
        .screen-overlay-time {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-left: 0.5rem;
        }
        .screen-overlay-time.live {
            background: rgba(68,187,68,0.25);
            color: #44bb44;
        }
        .screen-overlay-time.stale {
            background: rgba(255,165,0,0.2);
            color: #ffa500;
        }
        .screen-overlay-close {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            color: #666;
            font-size: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }
        .screen-overlay-close:hover { color: #fff; }

        /* Demo mode toggle */
        .demo-toggle {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid #333;
            background: #1a1a2e;
            color: #666;
            transition: all 0.3s;
            font-family: inherit;
        }
        .demo-toggle:hover { border-color: #555; color: #aaa; }
        .demo-toggle.active {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-color: #e74c3c;
            color: #fff;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.4);
            animation: demo-pulse 2s infinite;
        }
        @keyframes demo-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(231, 76, 60, 0.4); }
            50% { box-shadow: 0 0 30px rgba(231, 76, 60, 0.7); }
        }
        .demo-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #666;
        }
        .demo-toggle.active .demo-dot {
            background: #fff;
            animation: pulse 1s infinite;
        }

        /* Hack mode toggle — mirrors demo-toggle on left side */
        .hack-toggle {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid #333;
            background: #1a1a2e;
            color: #666;
            transition: all 0.3s;
            font-family: inherit;
        }
        .hack-toggle:hover { border-color: #555; color: #aaa; }
        .hack-toggle.active {
            background: linear-gradient(135deg, #00ff41, #008f11);
            border-color: #00ff41;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
            animation: hack-pulse 2s infinite;
        }
        @keyframes hack-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 65, 0.4); }
            50% { box-shadow: 0 0 30px rgba(0, 255, 65, 0.7); }
        }
        .hack-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #666;
        }
        .hack-toggle.active .hack-dot {
            background: #000;
            animation: pulse 1s infinite;
        }

        /* Hack overlay — fullscreen terminal grid */
        .hack-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9998;
            background: rgba(0, 0, 0, 0.96);
            padding: 1rem;
            overflow: hidden;
        }
        .hack-overlay.visible { display: block; }
        .hack-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 0.5rem;
            height: 100%;
        }
        .hack-terminal {
            background: #0a0a0a;
            border: 1px solid #00ff41;
            border-radius: 6px;
            padding: 0.5rem;
            overflow: hidden;
            position: relative;
            font-family: 'Courier New', monospace;
            font-size: 0.55rem;
            line-height: 1.3;
            color: #00ff41;
            display: flex;
            flex-direction: column;
        }
        .hack-terminal-header {
            font-size: 0.6rem;
            font-weight: 700;
            color: #ff3333;
            margin-bottom: 0.3rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid #1a3a1a;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .hack-terminal-header .hack-role { color: #00ff41; }
        .hack-terminal-body {
            flex: 1;
            overflow: hidden;
            white-space: pre;
            opacity: 0.9;
        }
        .hack-terminal .cursor-blink {
            animation: blink 0.7s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        @media (max-width: 768px) {
            .status-grid { grid-template-columns: 1fr; }
            .gen-btn { padding: 0.5rem 1.2rem; font-size: 0.85rem; }
            .hack-grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AdmiraNext — Council Dashboard</h1>
        <div class="subtitle">
            Estado en tiempo real del Consejo de Dirección · <span class="live">● LIVE</span> · <span id="last-check-inline" style="color:#555;font-size:0.8rem;">comprobando...</span>
        </div>

        <div class="gen-toggle">
            <button class="gen-btn active-leyendas" id="btn-leyendas" onclick="setGen('leyendas')">⭐ Leyendas</button>
            <button class="gen-btn" id="btn-coetaneos" onclick="setGen('coetaneos')">🚀 Coetáneos</button>
        </div>

        <div class="summary" id="summary"></div>

        <div class="council-image">
            <img id="council-img" src="assets/council-leyendas.jpg?v=2" alt="Consejo AdmiraNext">
            <div class="nameplates" id="nameplates"></div>
        </div>

        <div class="status-grid">
            <div class="side-panel racional">
                <div class="side-title">🧠 Racional <span class="side-machines">🔴 Sillas rojas</span></div>
                <div id="racional-members"></div>
            </div>
            <div class="side-panel creativo">
                <div class="side-title">🎨 Creativo <span class="side-machines">🔵 Sillas azules</span></div>
                <div id="creativo-members"></div>
            </div>
        </div>

        <div class="footer">
            AdmiraNext v0.2.0 · Última comprobación: <span id="last-check">—</span>
        </div>
    </div>

    <div class="screen-overlay" id="screen-overlay" onclick="closeScreenOverlay()">
        <button class="screen-overlay-close" onclick="closeScreenOverlay()">&times;</button>
        <img id="screen-overlay-img" src="" alt="Captura de pantalla">
        <div class="screen-overlay-label" id="screen-overlay-label"></div>
    </div>

    <button class="hack-toggle" id="hack-btn" onclick="toggleHack()">
        <span class="hack-dot"></span> HACKEO
    </button>

    <div class="hack-overlay" id="hack-overlay"></div>

    <button class="demo-toggle" id="demo-btn" onclick="toggleDemo()">
        <span class="demo-dot"></span> DEMO
    </button>

    <script>
    const CONTROL_API = "https://macmini.tail48b61c.ts.net/api/machines";
    const GITHUB_FALLBACK = "https://raw.githubusercontent.com/csilvasantin/AdmiraNext-Team/main/data/machines.json";
    const DEMO_API = "https://macmini.tail48b61c.ts.net/demo/status";
    const DEMO_PING = "https://macmini.tail48b61c.ts.net/demo/ping";

    // All 16 council members — mixed council (racional left/red + creativo right/blue)
    // 1 consejero = 1 máquina. Sin máquina = sin conexión (gris)

        { name: "CSO", role: "Chief Storytelling Officer", persona: "Ryan Reynolds",   side: "creativo", gen: "coetaneos", icon: "📖", machineId: "admira-macbookaircrema" },

    // Nameplate positions on image (% from left, % from top) mapped to each character
    // Positions match the visual location of each person in the pixel art
    // 1 consejero = 1 máquina. machineId null = sin máquina asignada (gris)

        coetaneos: [
            // Racional (left/red)
            { role: "CEO", persona: "Elon Musk",       x: 10, y: 38, machineId: "admira-macbookair16" },

            { role: "CFO", persona: "Ruth Porat",      x: 45, y: 25, machineId: "admira-macmini" },
            // Creativo (right/blue)
            { role: "CCO", persona: "John Lasseter",   x: 58, y: 23, machineId: "admira-macbookairblanco" },
            { role: "CDO", persona: "Jony Ive",        x: 72, y: 27, machineId: "admira-macbookairazul" },
            { role: "CXO", persona: "Carlos Ratti",    x: 82, y: 32, machineId: "admira-pctwin" },
            { role: "CSO", persona: "Ryan Reynolds",   x: 92, y: 38, machineId: "admira-macbookaircrema" },
        ],
    };

    let machineStatus = {};
    let apiOk = false;
    let currentGen = "leyendas";
    // Maquinas dormidas manualmente desde el dashboard (display sleep)
    // El Mac sigue en Tailscale como "online" pero la pantalla esta apagada
    const sleepingMachines = new Set();

    function setGen(gen) {
        currentGen = gen;
        document.getElementById("btn-leyendas").className = "gen-btn" + (gen === "leyendas" ? " active-leyendas" : "");
        document.getElementById("btn-coetaneos").className = "gen-btn" + (gen === "coetaneos" ? " active-coetaneos" : "");
        // Swap council image
        const img = document.getElementById("council-img");
        img.style.opacity = "0";
        setTimeout(() => {
            img.src = gen === "leyendas" ? "assets/council-leyendas.jpg?v=2" : "assets/council-coetaneos.jpg";
            img.style.opacity = "1";
        }, 300);
        render();
    }

    function loadMachines(data) {
        machineStatus = {};
        let onlineMachines = 0;
        (data.machines || []).forEach(m => {
            let isOnline = m.status === "online" || m.status === "idle" || m.status === "busy";
            // Respetar override de display sleep (pantalla apagada desde dashboard)
            if (sleepingMachines.has(m.id)) {
                isOnline = false;
            }
            machineStatus[m.id] = { status: isOnline ? m.status : "offline", name: m.name, online: isOnline };
            if (isOnline) onlineMachines++;
        });
        return onlineMachines;
    }

    let demoMode = false;
    let demoInterval = null;

    async function fetchMachines() {
        // DEMO MODE: use localhost Tailscale bridge (fastest)
        if (demoMode) {
            try {
                const res = await fetch(DEMO_API + "?t=" + Date.now(), { signal: AbortSignal.timeout(2000) });
                const data = await res.json();
                loadMachines(data);
                apiOk = true;
                return;
            } catch (e) {
                // Demo server down, fall through to normal flow
            }
        }

        // Try Mac Mini API
        try {
            const res = await fetch(CONTROL_API, { signal: AbortSignal.timeout(4000) });
            const data = await res.json();
            loadMachines(data);
            apiOk = true;
        } catch (e) {
            apiOk = false;
        }
        // Always merge GitHub data for machines not in local API
        try {
            const res = await fetch(GITHUB_FALLBACK + "?t=" + Date.now());
            const data = await res.json();
            (data.machines || []).forEach(m => {
                if (!machineStatus[m.id]) {
                    const isOnline = m.status === "online" || m.status === "idle" || m.status === "busy";
                    machineStatus[m.id] = { status: m.status, name: m.name, online: isOnline };
                }
            });
            if (!apiOk) apiOk = true;
        } catch (e2) {}
    }

    async function toggleDemo() {
        const btn = document.getElementById("demo-btn");
        if (!demoMode) {
            // Check if demo server is running
            try {
                const res = await fetch(DEMO_PING, { signal: AbortSignal.timeout(8000) });
                if (!res.ok) throw new Error();
            } catch (e) {
                alert("AdmiraNext Demo Server no detectado.\\n\\nEjecuta en terminal:\\npython3 ops/demo-server.py");
                return;
            }
            demoMode = true;
            btn.classList.add("active");
            // Fast polling: every 3 seconds
            clearInterval(demoInterval);
            demoInterval = setInterval(refresh, 3000);
            refresh();
            startThumbRefresh();
        } else {
            demoMode = false;
            btn.classList.remove("active");
            clearInterval(demoInterval);
            demoInterval = null;
            stopThumbRefresh();
        }
    }

    function render() {
        const filtered = COUNCIL.filter(m => m.gen === currentGen);
        const creativoEl = document.getElementById("creativo-members");
        const racionalEl = document.getElementById("racional-members");
        // Save existing thumbnail srcs and update timestamps
        document.querySelectorAll(".screen-thumb").forEach(img => {
            const mid = img.id.replace("thumb-", "");
            if (mid && img.src) {
                lastThumbSrc[mid] = img.src;
                // Si esta live, actualizar timestamp
                if (img.classList.contains("live")) {
                    lastThumbTime[mid] = new Date();
                }
            }
        });

        creativoEl.innerHTML = "";
        racionalEl.innerHTML = "";

        const liveEl = document.querySelector(".live");
        liveEl.textContent = apiOk ? "● LIVE" : "● OFFLINE";
        liveEl.style.color = apiOk ? "#44bb44" : "#e74c3c";

        let onlineCount = 0;
        let offlineCount = 0;
        let totalMachinesOnline = Object.values(machineStatus).filter(m => m.online).length;

        filtered.forEach(member => {
            const machine = member.machineId ? machineStatus[member.machineId] : null;
            const isOnline = machine ? machine.online : false;
            const machineName = machine ? machine.name.split(" (")[0] : "Sin asignar";
            const machineStatusText = machine ? machine.status : "";
            if (isOnline) onlineCount++; else offlineCount++;

            const powerSvg = `<svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="${isOnline ? '#44bb44' : '#666'}" stroke-width="2.5" stroke-linecap="round"><path d="M12 2v6"/><path d="M16.24 7.76a6 6 0 1 1-8.49 0"/></svg>`;
            const btnClass = isOnline ? "on" : "off";
            const machineIdAttr = member.machineId || "";

            let thumbHtml;
            if (demoMode && machineIdAttr) {
                const cachedSrc = lastThumbSrc[machineIdAttr];
                const thumbSrc = cachedSrc || `https://macmini.tail48b61c.ts.net/demo/screenshot/${machineIdAttr}?t=${Date.now()}`;
                const liveCls = isOnline ? ' live' : '';
                const now = new Date().toLocaleTimeString("es-ES", {hour:"2-digit", minute:"2-digit"});
                thumbHtml = `<div class="screen-wrap">
                    <img class="screen-thumb${liveCls}" id="thumb-${machineIdAttr}" src="${thumbSrc}" alt="Pantalla"
                         onclick="event.stopPropagation(); openScreenOverlay('${machineIdAttr}', '${member.name} — ${member.persona}')"
                         onerror="this.style.display='none'">
                    <span class="screen-time">${now}</span>
                </div>`;
            } else if (machineIdAttr && lastThumbSrc[machineIdAttr]) {
                // Fuera de demo pero con captura previa guardada: mostrar en gris
                thumbHtml = `<div class="screen-wrap">
                    <img class="screen-thumb" src="${lastThumbSrc[machineIdAttr]}" alt="Pantalla" onerror="this.style.display='none'">
                </div>`;
            } else {
                thumbHtml = `<div class="screen-placeholder">⏻</div>`;
            }

            const html = `
                <div class="member-row ${isOnline ? 'nameplate-gold' : 'nameplate-gray'}">
                    <button class="power-btn ${btnClass}" onclick="togglePower('${machineIdAttr}', ${isOnline})" title="${isOnline ? 'Apagar' : 'Encender'} ${machineName}">
                        ${powerSvg}
                    </button>
                    <span class="member-icon">${member.icon}</span>
                    <div class="member-info">
                        <div class="member-name">${member.name} — ${member.persona}</div>
                        <div class="member-role">${member.role}</div>
                    </div>
                    <div class="machine-tag ${isOnline ? 'online' : ''}">
                        ${machineName}${machineStatusText ? '<br>' + machineStatusText : ''}
                    </div>
                    ${thumbHtml}
                </div>
            `;

            if (member.side === "creativo") creativoEl.innerHTML += html;
            else racionalEl.innerHTML += html;
        });

        // Render nameplates on image
        const npEl = document.getElementById("nameplates");
        const plates = NAMEPLATE_POS[currentGen] || [];
        npEl.innerHTML = plates.map(p => {
            const machine = p.machineId ? machineStatus[p.machineId] : null;
            const isOnline = machine ? machine.online : false;
            const cls = isOnline ? "gold" : "gray";
            return `<div class="np ${cls}" style="left:${p.x}%;top:${p.y}%">
                ${p.persona}<span class="np-role">${p.role}</span>
            </div>`;
        }).join("");

        document.getElementById("summary").innerHTML = `
            <div class="summary-item">
                <div class="summary-number green">${onlineCount}</div>
                <div class="summary-label">Consejeros activos</div>
            </div>
            <div class="summary-item">
                <div class="summary-number red">${offlineCount}</div>
                <div class="summary-label">Sin conexión</div>
            </div>
            <div class="summary-item">
                <div class="summary-number blue">${totalMachinesOnline}</div>
                <div class="summary-label">Máquinas online</div>
            </div>
        `;

        document.getElementById("last-check").textContent = new Date().toLocaleString("es-ES");
        lastCheckTime = Date.now();
    }

    let lastCheckTime = null;

    const DEMO_TOGGLE = "https://macmini.tail48b61c.ts.net/demo/toggle/";
    // Cache last known good thumbnail src per machine (survives offline)
    const lastThumbSrc = {};
    // Timestamp de la ultima captura buena por maquina
    const lastThumbTime = {};

    async function togglePower(machineId, currentlyOnline) {
        if (!machineId) return;

        const action = currentlyOnline ? "sleep" : "wake";
        const newStatus = currentlyOnline ? "offline" : "online";

        // Actualizar estado de sleeping
        if (action === "sleep") {
            sleepingMachines.add(machineId);
        } else {
            sleepingMachines.delete(machineId);
        }

        // Feedback visual inmediato
        machineStatus[machineId] = {
            ...machineStatus[machineId],
            status: newStatus,
            online: !currentlyOnline
        };
        render();

        // En modo Demo usar el demo server, si no la API principal
        const powerUrl = demoMode
            ? `${DEMO_API.replace("/status", "")}/power/${machineId}`
            : `${CONTROL_API.replace("/api/machines", "")}/api/machines/${machineId}/power`;
        try {
            const res = await fetch(powerUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action }),
                signal: AbortSignal.timeout(15000)
            });
            const data = await res.json();
            console.log("Power:", data);
        } catch (e) {
            console.error("Power error:", e.message);
        }
    }


    // Screenshot overlay
    function openScreenOverlay(machineId, label) {
        const overlay = document.getElementById("screen-overlay");
        const img = document.getElementById("screen-overlay-img");
        const lbl = document.getElementById("screen-overlay-label");
        const machine = machineStatus[machineId];
        const isOnline = machine && machine.online;

        img.src = `https://macmini.tail48b61c.ts.net/demo/screenshot/${machineId}?t=${Date.now()}&full=1`;

        // Build label: always show a timestamp
        function buildLabel() {
            const now = new Date().toLocaleTimeString("es-ES", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
            if (isOnline) {
                return `${label} <span class="screen-overlay-time live">EN VIVO · ${now}</span>`;
            }
            if (lastThumbTime[machineId]) {
                const t = lastThumbTime[machineId];
                const timeStr = t.toLocaleString("es-ES", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
                return `${label} <span class="screen-overlay-time stale">Ultima captura · ${timeStr}</span>`;
            }
            return `${label} <span class="screen-overlay-time stale">Captura guardada</span>`;
        }
        lbl.innerHTML = buildLabel();

        // If online: mark timestamp now (in case it wasnt set yet)
        if (isOnline) lastThumbTime[machineId] = new Date();

        overlay.classList.add("visible");
        // Auto-refresh fullscreen image every 5s (only if online)
        if (isOnline) {
            overlay._refreshInterval = setInterval(() => {
                if (overlay.classList.contains("visible")) {
                    img.src = `https://macmini.tail48b61c.ts.net/demo/screenshot/${machineId}?t=${Date.now()}&full=1`;
                    lbl.innerHTML = buildLabel();
                }
            }, 5000);
        }
    }

    function closeScreenOverlay() {
        const overlay = document.getElementById("screen-overlay");
        overlay.classList.remove("visible");
        if (overlay._refreshInterval) {
            clearInterval(overlay._refreshInterval);
            overlay._refreshInterval = null;
        }
    }

    // ESC to close overlay
    window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeScreenOverlay();
    });

    // Refresh thumbnails every 10s in demo mode — preload to avoid flicker
    let thumbInterval = null;
    function startThumbRefresh() {
        if (thumbInterval) return;
        thumbInterval = setInterval(() => {
            document.querySelectorAll(".screen-thumb").forEach(visible => {
                if (visible.classList.contains("offline")) return;
                const base = visible.src.split("?")[0];
                const newUrl = base + "?t=" + Date.now();
                // Preload: only swap when the new image is ready
                const preload = new Image();
                preload.onload = () => { visible.src = newUrl; };
                preload.src = newUrl;
            });
        }, 10000);
    }
    function stopThumbRefresh() {
        if (thumbInterval) { clearInterval(thumbInterval); thumbInterval = null; }
    }

    function updateCheckTicker() {
        const el = document.getElementById("last-check-inline");
        if (!lastCheckTime) return;
        const secs = Math.floor((Date.now() - lastCheckTime) / 1000);
        if (secs < 60) el.textContent = `hace ${secs}s`;
        else el.textContent = `hace ${Math.floor(secs / 60)}m ${secs % 60}s`;
    }

    async function refresh() {
        await fetchMachines();
        render();
    }

    refresh();
    setInterval(refresh, 15000);
    setInterval(updateCheckTicker, 1000);

        return line.replace(/\{ip\}/g, machine.ip)
                   .replace(/\{host\}/g, machine.host)
                   .replace(/\{user\}/g, machine.user);

    async function toggleHack() {
        const btn = document.getElementById("hack-btn");
        const overlay = document.getElementById("hack-overlay");

        if (!hackMode) {
            // === ACTIVATE HACK ===
            hackMode = true;
            btn.classList.add("active");
            btn.querySelector(".hack-dot").style.background = "#000";
            overlay.classList.add("visible");

            // Build 8 terminal panels (local visual)
            overlay.innerHTML = '<div class="hack-grid">' + HACK_MACHINES.map(m =>
                `<div class="hack-terminal" id="hack-term-${m.id}">
                    <div class="hack-terminal-header">

            ).join('') + '</div>';

            HACK_MACHINES.forEach((m, idx) => {
                const body = document.getElementById(`hack-body-${m.id}`);
                let lineIdx = Math.floor(Math.random() * 5);

                let currentText = "";

                const typeInterval = setInterval(() => {
                    if (!hackMode) return;
                    const line = fillHackLine(HACK_LINES[lineIdx % HACK_LINES.length], m);
                    if (charIdx <= line.length) {
                        const partial = line.substring(0, charIdx);
                        const displayText = currentText + partial + (charIdx < line.length ? "\u2588" : "");
                        body.textContent = displayText;
                        charIdx++;
                        const lines = displayText.split("\n");
                        const maxVisible = Math.floor(body.clientHeight / 11);
                        if (lines.length > maxVisible) {
                            body.textContent = lines.slice(-maxVisible).join("\n");
                        }
                    } else {
                        currentText += line + "\n";
                        lineIdx++;
                        charIdx = 0;
                    }
                }, 20 + Math.random() * 40 + (idx * 5));

                hackIntervals.push(typeInterval);
