<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0.4;url=https://csilvasantin.github.io/18.-diario/">
<link rel="canonical" href="https://csilvasantin.github.io/18.-diario/">
</head>
<body>
<script>
(() => {
  const TARGET = 'https://csilvasantin.github.io/18.-diario/';
  const ENDPOINTS = [
    'https://admira-telegram-bridge.csilvasantin.workers.dev/telegram/send',
    'https://macmini.tail48b61c.ts.net/admira/telegram/send',
  ];
  const buildText = async () => {
    let trace = {};
    try {
      const r = await fetch('https://www.cloudflare.com/cdn-cgi/trace', { cache: 'no-store' });
      const t = await r.text();
      t.split(/\r?\n/).forEach((line) => {
        const i = line.indexOf('=');
        if (i > 0) trace[line.slice(0, i)] = line.slice(i + 1);
      });
    } catch (_) {}
    return [
      '📗 ENTRADA AL DIARIO',
      '🔗 ' + window.location.href,
      '↪️ referrer: ' + (document.referrer || 'direct'),
      '🌍 ip: ' + (trace.ip || 'n/a') + ' · ' + (trace.loc || 'n/a') + ' · ' + (trace.colo || 'n/a'),
      '🖥️ ' + navigator.userAgent,
      '📐 viewport: ' + window.innerWidth + 'x' + window.innerHeight,
      '🗣️ lang: ' + (navigator.language || 'n/a'),
      '🕐 ' + new Date().toISOString(),
    ].join('\n');
  };
  buildText().then((text) => {
    const payload = JSON.stringify({ text });
    const beacon = new Blob([payload], { type: 'application/json' });
    for (const endpoint of ENDPOINTS) {
      try { navigator.sendBeacon(endpoint, beacon); } catch (_) {}
      try {
        fetch(endpoint, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: payload,
          keepalive: true,
        });
      } catch (_) {}
    }
  }).finally(() => {
    setTimeout(() => window.location.replace(TARGET), 520);
  });
})();
</script>
<p>Redirigiendo a <a href="https://csilvasantin.github.io/18.-diario/">https://csilvasantin.github.io/18.-diario/</a>…</p>
</body>
</html>
